[project]
name = "amc-watch"
version = "0.1.0"
description = "Invite-only hosted seat-watching service for AMC Seat Pages"
requires-python = ">=3.12"
dependencies = [
    # Transport behavior is load-bearing and per-host (ADR-0003 as amended, ADR-0005):
    # python-requests passes AMC's Cloudflare hardening on www.amctheatres.com where curl
    # 403s; graph.amctheatres.com 403s requests AND curl and needs curl_cffi's browser
    # TLS fingerprint. Do not swap either out casually.
    "requests>=2.31",
    "curl_cffi>=0.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.9",
]

[project.scripts]
amc-watch = "amc_watch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amc_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real amctheatres.com; deselected by default (-m 'not live')",
]
addopts = "-m 'not live'"
