[project]
name = "amc-watch"
version = "0.1.0"
description = "Invite-only hosted seat-watching service for AMC Seat Pages"
requires-python = ">=3.12"
dependencies = [
    # The fetch core's transport behavior is load-bearing: python-requests passes AMC's
    # Cloudflare hardening where curl 403s (ADR-0003). Do not swap this out casually.
    "requests>=2.31",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.9",
]

[project.scripts]
amc-watch = "amc_watch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amc_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real amctheatres.com; deselected by default (-m 'not live')",
]
addopts = "-m 'not live'"
