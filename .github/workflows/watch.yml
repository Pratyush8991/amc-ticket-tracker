name: AMC seat watch

on:
  schedule:
    # Every 5 minutes (GitHub's minimum). Triggers are best-effort and can be
    # delayed/skipped; the script's internal ~4.5-min poll loop covers the gap.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you run it on demand from the Actions tab

concurrency:
  group: amc-seat-watch
  cancel-in-progress: false   # let an in-flight run finish rather than overlap

permissions:
  contents: write   # to commit state.json back to the repo

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python + deps
        run: |
          uv venv --python 3.12
          uv pip install -r requirements.txt

      - name: Poll seat maps
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: uv run python amc_watch.py

      - name: Persist notified state
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name  "amc-watch-bot"
            git config user.email "amc-watch-bot@users.noreply.github.com"
            git add state.json
            git commit -m "state: update notified seats [skip ci]"
            git push
          else
            echo "No state change."
          fi
