name: AMC seat watch

on:
  schedule:
    # Every 5 minutes (GitHub's minimum). Triggers are best-effort and can be
    # delayed/skipped; the script's internal ~4.5-min poll loop covers the gap.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you run it on demand from the Actions tab

concurrency:
  group: amc-seat-watch
  cancel-in-progress: false   # let an in-flight run finish rather than overlap

permissions:
  contents: read   # read-only; state is not persisted back to the repo

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python + deps
        run: |
          uv venv --python 3.12
          uv pip install -r requirements.txt

      # Dedup state (state.json) is per-run in CI: the internal poll loop avoids repeat
      # alerts within a run, but a seat still open on the next trigger may re-alert. For
      # cross-run dedup and a true ~60s loop, run under launchd/systemd on an always-on
      # box (see README) instead.
      - name: Poll seat maps
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: uv run python -m amc_watch
